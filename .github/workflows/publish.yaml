name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to publish'
        required: true
        type: choice
        # Add a crate here when it lands, not before: a name that is not a workspace
        # member fails in the version check below rather than doing anything useful.
        options:
          - rscni-types
          - rscni-plugin
          - rscni
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string
      dry-run:
        description: 'Dry-run mode (test without publishing)'
        required: true
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish ${{ inputs.crate }} to crates.io
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.crate }}-v${{ inputs.version }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The root manifest is virtual and holds no version, so ask cargo which version
      # the named crate actually declares.
      - name: Verify version
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -er --arg c "${{ inputs.crate }}" '.packages[] | select(.name==$c) | .version')
          if [ "${{ inputs.version }}" != "$CARGO_VERSION" ]; then
            echo "Error: Input version (${{ inputs.version }}) does not match ${{ inputs.crate }}'s Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version check passed: ${{ inputs.crate }} ${{ inputs.version }}"

      # No "verify tag exists" step: the checkout above already used the tag as its ref,
      # so the job cannot get this far if it is missing.

      # Same suite as the CI and release gates, so publishing cannot be held to a
      # weaker bar than a PR.
      - name: Run tests
        run: |
          cargo test --workspace --lib
          cargo test --workspace --lib --all-features
          cargo test --workspace --doc --all-features
          cargo build --package rscni-debug --package async-rscni-debug
          cargo test --package integration-tests

      # Dependencies must already be on crates.io: rscni-types before rscni-plugin,
      # rscni-plugin before rscni. A missing one fails here rather than half-publishing.
      - name: Publish to crates.io
        run: |
          if [ "${{ inputs.dry-run }}" == "true" ]; then
            echo "🔍 Running in dry-run mode..."
            cargo publish --package ${{ inputs.crate }} --dry-run
            echo "✅ Dry-run completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "📦 Publishing to crates.io..."
            cargo publish --package ${{ inputs.crate }} --token ${{ secrets.CRATES_TOKEN }}
            echo "✅ Published to crates.io" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ inputs.dry-run }}" == "true" ]; then
            echo "🔍 Dry-run completed for ${{ inputs.crate }} v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No changes were made to crates.io. To publish, run the workflow again with dry-run disabled." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Successfully published ${{ inputs.crate }} v${{ inputs.version }} to crates.io" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- crates.io: https://crates.io/crates/${{ inputs.crate }}/${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "- docs.rs: https://docs.rs/${{ inputs.crate }}/${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
