name: Release

on:
  push:
    tags:
      # One tag per crate: rscni-types-v0.1.0, rscni-plugin-v0.3.0, rscni-v0.3.0, ...
      # Tags v0.1.0 through v0.2.1 predate the workspace split and are not matched.
      - '*-v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Validate the release
  validate:
    name: Validate Release
    runs-on: ubuntu-24.04
    outputs:
      crate: ${{ steps.tag.outputs.CRATE }}
      version: ${{ steps.tag.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        # No-arg install resolves rust-toolchain.toml — the same pin rustup uses
        # locally — including its components and profile. Documented rustup behavior
        # since 1.28; the runners ship newer.
        run: rustup toolchain install

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-target-release-

      # Split `<crate>-v<version>`. Crate names contain hyphens, versions do not
      # contain `-v`, so the longest-match trims are unambiguous.
      - name: Parse tag
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          CRATE=${TAG%-v*}
          VERSION=${TAG##*-v}
          echo "CRATE=$CRATE" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing $CRATE $VERSION"

      # The root manifest is virtual and holds no version, so ask cargo what the named
      # crate declares. One `cargo metadata` for both checks.
      - name: Verify the crate and its version
        run: |
          CRATE=${{ steps.tag.outputs.CRATE }}
          VERSION=${{ steps.tag.outputs.VERSION }}
          META=$(cargo metadata --no-deps --format-version 1)
          # -e here so a crate name that is not a workspace member fails immediately
          # (jq exits 4 when it produces no output).
          CARGO_VERSION=$(jq -er --arg c "$CRATE" \
            '.packages[] | select(.name==$c) | .version' <<<"$META")
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($VERSION) does not match $CRATE's Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          # Plain -r, NOT -e: a publishable crate has `publish: null`, and jq -e exits 1
          # on a null result, which would fail this step under `bash -e` for every
          # release. The crate name was already validated above.
          PUBLISH=$(jq -r --arg c "$CRATE" \
            '.packages[] | select(.name==$c) | .publish' <<<"$META")
          if [ "$PUBLISH" != "null" ]; then
            echo "Error: $CRATE has publish = false"
            exit 1
          fi
          echo "Version check passed: $CRATE $VERSION"

      # Run all checks
      - name: Run fmt check
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      # Run all tests. `--workspace` rather than a `--package` per crate, so a crate
      # added later is covered without editing this.
      - name: Test libraries (default features)
        run: cargo test --workspace --lib

      - name: Test libraries (all features)
        run: cargo test --workspace --lib --all-features

      - name: Test documents
        run: cargo test --workspace --doc --all-features

      - name: Build debug plugins
        run: cargo build --package rscni-examples

      - name: Test cross-crate integration
        run: cargo test --package integration-tests

      # Verify the packages can be built. Done for the whole publishable set rather than
      # just the tagged crate, because cargo verifies each packaged crate against the
      # others it just built — packaging rscni-plugin alone would fail whenever the
      # rscni-types version it wants is not on crates.io yet.
      - name: Dry-run package
        run: cargo package -p rscni-types -p rscni-plugin -p rscni --allow-dirty

  # Create GitHub Release (automatic on tag push)
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if [[ "${{ github.ref }}" == *"alpha"* ]] || [[ "${{ github.ref }}" == *"beta"* ]] || [[ "${{ github.ref }}" == *"rc"* ]] || [[ "${{ github.ref }}" == *"dev"* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create ${{ github.ref_name }} \
            --title "${{ needs.validate.outputs.crate }} v${{ needs.validate.outputs.version }}" \
            --generate-notes \
            $PRERELEASE
