[workspace]
# A virtual manifest does not infer the resolver from `edition`, so it must be set here.
resolver = "3"
members = [
  "types",
  "plugin",
  "rscni",
  "examples",
  "tests/integration",
]

[workspace.package]
edition = "2024"
authors = ["terassyi <iscale821@gmail.com>"]
repository = "https://github.com/terassyi/rscni"
homepage = "https://github.com/terassyi/rscni"
keywords = ["cni", "container", "networking", "kubernetes"]
categories = ["network-programming", "api-bindings"]
license = "Apache-2.0"
# `readme` is deliberately NOT inherited: an inherited value resolves against the
# workspace root, which would point every crate at the top-level README. Each crate
# sets its own.

[workspace.dependencies]
async-trait = "0.1.89"
ipnet = { version = "2.11.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

rstest = "0.26.1"
tempfile = "3.14.0"
tokio = "1.48.0"

# Opted into per crate; everything inherits these except the examples. Test code is
# held to the same bar — tests return `Result` and use `?` instead of unwrap.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
